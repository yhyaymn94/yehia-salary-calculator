<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة المرتب والشيفتات - Yehia Ayman</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        /* Splash Screen Styles */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0b1120;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            background-image: radial-gradient(circle at center, #1e293b 0%, #0b1120 100%);
        }
        .splash-logo {
            font-size: 38px;
            font-weight: 900;
            color: #38bdf8;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .splash-sub {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        .avatar-badge {
            width: 80px; height: 80px;
            border: 2px solid #38bdf8;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            font-weight: 700;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
            margin-bottom: 15px;
        }
        .splash-welcome {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .splash-name {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 25px;
        }
        .loading-bar {
            width: 180px;
            height: 3px;
            background: #1e293b;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background: #38bdf8;
            animation: loadAnim 2s forwards;
        }
        @keyframes loadAnim {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .splash-footer {
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- شاشة التحميل (Splash Screen) -->
    <div id="splash-screen">
        <div class="splash-logo">OverShift ⚡</div>
        <div class="splash-sub">Shift Performance • Optimized</div>
        
        <div class="avatar-badge">YA</div>
        <div class="splash-welcome">WELCOME</div>
        <div class="splash-name">Yehia Ayman</div>

        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <div class="splash-footer">Loading Your Personal Dashboard...</div>
    </div>

                    <!-- Developer Signature -->
                    <div class="flex items-center gap-2 mt-2">
                        <span class="text-xs text-slate-300">تطوير وتصميم:</span>
                        <span class="bg-sky-500/20 text-sky-300 text-xs font-bold px-2.5 py-0.5 rounded-full border border-sky-400/30 flex items-center gap-1">
                            <i class="fa-solid fa-code text-[10px]"></i> Yehia Ayman
                        </span>
                    </div>
                </div>
                
                <!-- Live Egypt Clock Widget -->
                <div class="bg-slate-800/80 backdrop-blur-md px-4 py-3 rounded-xl border border-slate-700/60 shadow-inner flex items-center gap-4 self-start md:self-auto">

                        <i class="fa-regular fa-clock text-xl sm:text-2xl"></i>

                    <div>

                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8 w-full flex-grow">
        
        <!-- Summary Cards Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 mb-8">
            <!-- Card 1: Base Salary -->
            <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm font-bold text-slate-500">المرتب الأساسي</span>
                    <span class="p-2 bg-blue-50 text-blue-600 rounded-lg text-sm"><i class="fa-solid fa-money-bill-wave"></i></span>
                </div>
                <div class="text-2xl font-extrabold text-slate-900"
